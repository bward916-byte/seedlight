<body>
<canvas id="c"></canvas>
<div id="rot">Turn your phone sideways<br><small>SEEDLIGHT plays in landscape</small></div>
<script>
'use strict';
/* ============================================================
   SEEDLIGHT — build 1  (Hollow Vale · Shard Canyons · The Crown)
   single-file HTML5 canvas platformer
   ============================================================ */
const W=1920,H=(('ontouchstart' in window)||navigator.maxTouchPoints>0)?860:1080;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const easeOutBack=t=>{const c=1.4;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const easeInOut=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(x,y=0)=>{let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h)};
function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)}
function fbm(x,o=3){let a=0,amp=.5,f=1;for(let i=0;i<o;i++){a+=noise1(x*f)*amp;f*=2.1;amp*=.5}return a}
const TAU=Math.PI*2;
const rectsHit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rgba(hex,a){return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`}
function mixHex(a,b,t){const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];const A=p(a),B=p(b);const c=v=>('0'+Math.round(clamp(v,0,255)).toString(16)).slice(-2);return '#'+c(lerp(A[0],B[0],t))+c(lerp(A[1],B[1],t))+c(lerp(A[2],B[2],t))}

/* ---------- canvas ---------- */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');const MAINCTX=ctx;
let DPR=1,SC=1,LW=W,CW=0,CH=0;          // SC: device px per logical px (logical height fixed at 1080). LW: logical width.
const FILTER_OK=('filter' in ctx);
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const vv=window.visualViewport;const w=Math.round(vv?vv.width:innerWidth),h=Math.round(vv?vv.height:innerHeight);cv.style.width=w+'px';cv.style.height=h+'px';CW=Math.floor(w*DPR);CH=Math.floor(h*DPR);cv.width=CW;cv.height=CH;SC=CH/H;LW=CW/SC;makeLightCanvas();}
const lightC=document.createElement('canvas'),lctx=lightC.getContext('2d');
let LS=.5; // light canvas scale relative to logical
function makeLightCanvas(){lightC.width=Math.ceil(LW*LS);lightC.height=Math.ceil(H*LS)}
window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));resize();setTimeout(resize,300);
// grain tile
const grainC=document.createElement('canvas');grainC.width=grainC.height=256;{const g=grainC.getContext('2d'),im=g.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=120+Math.random()*135|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0)}
let grainPat=null;

/* ---------- input ---------- */
const keys={};
const inp={l:0,r:0,u:0,d:0,jump:0,jumpP:0,jumpR:0,spell:[0,0,0,0,0],spellP:[0,0,0,0,0],act:0,actP:0,any:0,anyP:0,back:0,backP:0,axis:0};
let isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
let touchSeen=false;
const prev={jump:0,act:0,any:0,back:0,spell:[0,0,0,0,0]};
const pressedQ=[];
window.addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;keys._any=1;pressedQ.push(e.code);if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.code]=0;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=0});
// touch / pointer
const ptrs=new Map();   // id -> {x,y,down:t}
function ptrPos(e){return {x:e.clientX*DPR/SC,y:e.clientY*DPR/SC}}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){touchSeen=true;isTouch=true}const p=ptrPos(e);ptrs.set(e.pointerId,{x:p.x,y:p.y,sx:p.x,sy:p.y,t:0,fresh:true,type:e.pointerType});cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);e.preventDefault()},{passive:false});
cv.addEventListener('pointermove',e=>{const q=ptrs.get(e.pointerId);if(q){const p=ptrPos(e);q.x=p.x;q.y=p.y}});
const endPtr=e=>{const q=ptrs.get(e.pointerId);if(q){q.up=true}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);cv.addEventListener('pointerleave',e=>{if(e.pointerType==='touch')endPtr(e)});
// on-screen gamepad layout (logical screen coords, computed each frame from LW)
const pad={stick:{x:0,y:0,r:92,knob:46,dx:0,dy:0,active:false,id:null}};
function layoutPad(){
  const st=pad.stick;if(!st.active){st.x=170;st.y=H-160;st.dx=0;st.dy=0}
  const ax=LW-140,ay=H-140;pad.jump={x:ax,y:ay,r:86};
  pad.spells=[];const angs=[165,118,72];for(let i=0;i<3;i++){const a=angs[i]*Math.PI/180;pad.spells.push({x:ax+Math.cos(a)*190,y:ay-Math.sin(a)*190,r:48,i})}
  pad.menu={x:LW-70,y:70,r:40};
}
const inCirc=(p,c)=>{const dx=p.x-c.x,dy=p.y-c.y;return dx*dx+dy*dy<c.r*c.r};
// gamepad
let gp=null,gpSeen=false;
function pollGamepad(){const gs=navigator.getGamepads?navigator.getGamepads():[];gp=null;for(const g of gs){if(g&&g.connected){gp=g;gpSeen=true;break}}}

function readInput(){
  pollGamepad();layoutPad();
  let l=0,r=0,u=0,d=0,jump=0,act=0,any=0,back=0;const sp=[0,0,0,0,0];const taps=[];inp.taps=taps;
  for(const [id,q] of ptrs){if(q.fresh)taps.push({x:q.x,y:q.y,type:q.type})}
  // keyboard
  if(keys.KeyA||keys.ArrowLeft)l=1;if(keys.KeyD||keys.ArrowRight)r=1;if(keys.KeyW||keys.ArrowUp)u=1;if(keys.KeyS||keys.ArrowDown)d=1;
  if(keys.Space||keys.KeyW||keys.ArrowUp||keys.KeyZ||keys.KeyK)jump=1;
  if(keys.KeyE||keys.Enter||keys.ArrowUp||keys.KeyW)act=1;
  if(keys.Escape||keys.Backspace||keys.KeyQ)back=1;
  for(let i=0;i<5;i++)if(keys['Digit'+(i+1)]||keys['Numpad'+(i+1)])sp[i]=1;
  if(keys._any){any=1;keys._any=0}
  // gamepad
  if(gp){const ax=gp.axes[0]||0,ay=gp.axes[1]||0;const b=i=>gp.buttons[i]&&gp.buttons[i].pressed;
    if(ax<-.35||b(14))l=1;if(ax>.35||b(15))r=1;if(ay<-.5||b(12))u=1;if(ay>.5||b(13))d=1;
    if(b(0))jump=1;if(b(3)||b(12))act=1;if(b(2))sp[0]=1;if(b(1))sp[1]=1;if(b(5))sp[2]=1;if(b(4))sp[3]=1;if(b(7))sp[4]=1;if(b(9)||b(1))back=b(9)?1:back;
    if(gp.buttons.some(x=>x.pressed))any=1;}
  // touch pad
  for(const [id,q] of ptrs){
    if(q.up){if(q.stick){const st=pad.stick;st.active=false;st.id=null;st.dx=st.dy=0}ptrs.delete(id);if(!q.fresh)continue}
    any=1;
    if(!(isTouch&&touchSeen)&&q.type!=='touch'){ // mouse click: treat as "any" + act
      if(q.fresh)act=1;
    }else{
      const st=pad.stick;
      if(q.fresh&&!q.stick&&!st.active&&q.sx<LW*.45&&q.sy>H*.2&&!inCirc(q,pad.menu)){q.stick=true;st.active=true;st.id=id;st.x=clamp(q.sx,120,LW*.45-100);st.y=clamp(q.sy,H*.3,H-110)}
      if(q.stick){let dx=q.x-st.x,dy=q.y-st.y;const len=Math.hypot(dx,dy);if(len>st.r){dx*=st.r/len;dy*=st.r/len}st.dx=dx;st.dy=dy;
        const nx=dx/st.r,ny=dy/st.r;if(nx<-.22)l=Math.min(1,(-nx-.22)/.5);if(nx>.22)r=Math.min(1,(nx-.22)/.5);if(ny<-.5)u=1,act=1;if(ny>.5)d=1;
        if(q.up){st.active=false;st.id=null;st.dx=st.dy=0}}
      else{
        if(inCirc(q,pad.jump))jump=1;
        for(const s of pad.spells)if(inCirc(q,s))sp[s.i]=1;
        if(inCirc(q,pad.menu)&&q.fresh)back=1;
      }
    }
    q.fresh=false;
  }
  const pq=pressedQ.splice(0);const hit=(...c)=>pq.some(k=>c.includes(k));inp.pressed=pq;
  inp.l=l?1:0;inp.r=r?1:0;inp.u=u;inp.d=d;inp.axis=clamp(r-l,-1,1);
  inp.jump=jump;inp.jumpP=(jump&&!prev.jump)||hit('Space','KeyW','ArrowUp','KeyZ','KeyK');inp.jumpR=!jump&&prev.jump;prev.jump=jump;
  inp.act=act;inp.actP=(act&&!prev.act)||hit('KeyE','Enter','ArrowUp','KeyW');prev.act=act;
  inp.any=any;inp.anyP=(any&&!prev.any)||pq.length>0;prev.any=any;
  inp.back=back;inp.backP=(back&&!prev.back)||hit('Escape','Backspace','KeyQ');prev.back=back;
  for(let i=0;i<5;i++){inp.spell[i]=sp[i];inp.spellP[i]=(sp[i]&&!prev.spell[i])||hit('Digit'+(i+1),'Numpad'+(i+1));prev.spell[i]=sp[i]}
}
// tap helper for menus: returns {x,y} of a fresh tap this frame in logical screen coords, else null
function freshTap(){for(const [id,q] of ptrs){if(q.fresh&&!q.up)return q}return null}

/* ============================================================
   WORLD
   y is down. Vale ground at y=-40. Canyon slot x 5000..8600, summit y=-7560.
   ============================================================ */
const DUR={grass:2.4,flower:3,shrub:4,oak:5,pine:5,ancient:8,vine:5,moss:3,bough:4.5,fungus:2,stump:0,alpine:3};
const REQ={grass:0,flower:1,shrub:1,oak:1,pine:1,ancient:0,vine:1,moss:1,bough:1,fungus:0,stump:0,alpine:0};
const MOTE={grass:['sun',1],flower:['sun',1],shrub:['sun',2],oak:['sun',3],pine:['sun',3],ancient:['amber',1],vine:['sun',1],moss:['dew',1],bough:['sun',2],fungus:['spore',1],alpine:['sun',1],stump:['sun',0]};
const AURA_R={grass:120,flower:140,shrub:150,oak:170,pine:170,ancient:180,vine:170,moss:170,bough:260,fungus:150,stump:200,alpine:140};

const world={solids:[],oneway:[],vines:[],moss:[],targets:[],enemies:[],shrines:[],glades:[],gates:[],caves:[],pickups:[],decor:[],pines:[],bounds:{x0:-600,x1:9400}};
const SLOT={x0:5000,x1:8600,wallL:5000,wallR:8600,top:-7560,floor:-40};
let tid=0;
function solid(x,y,w,h,kind,ex){const s=Object.assign({x,y,w,h,kind},ex||{});world.solids.push(s);return s}
function T(kind,x,y,ex){const t=Object.assign({id:tid++,kind,x,y,t:0,dur:DUR[kind],alive:false,seed:(tid*7919+13)%100000,req:REQ[kind],glade:null,r:AURA_R[kind],sway:Math.random()*TAU,bake:null,hidden:false},ex||{});world.targets.push(t);return t}
function grassRow(x0,x1,y,step){for(let x=x0+40;x<x1-20;x+=step+ (hash(x)*30|0)){T('grass',x,y)}}
function enemy(kind,x,y,ex){const e=Object.assign({kind,x,y,vx:0,vy:0,hp:kind==='shambler'?3:2,maxhp:kind==='shambler'?3:2,state:'idle',timer:0,dir:-1,anchor:{x,y},held:0,flash:0,dead:false,seed:Math.random()*100},ex||{});world.enemies.push(e);return e}

function buildWorld(){
  const w=world;
  // ---- bounds ----
  solid(-1000,-4000,400,5000,'wall');
  // ---- HOLLOW VALE ground ----
  const G=[[-600,1500,-40],[1500,2700,-80],[2700,3600,-120],[3600,5000,-80],[5000,8600,-40]];
  for(const [a,b,y] of G){solid(a,y,b-a,1400,'ground');}
  // hills / rocks in the vale
  solid(900,-220,260,150,'rock');           // boulder
  solid(2000,-460,300,60,'rock',{shard:1}); // ancient oak ledge (reach via oak bough)
  solid(3250,-320,220,60,'rock',{shard:1});
  solid(4000,-500,220,60,'rock',{shard:1}); // double-jump reward ledge
  // mountain body (right half of vale, above), cave carved at pocket 1
  solid(2600,-7560,2100,5480,'wall');              // -7560 .. -2080 (plateau top is the Crown)
  solid(3400,-1860,1300,460,'wall');               // -1860 .. -1400
  // canyon walls (left wall has an arch at the bottom and the cave opening at -2080..-1860)
  solid(4700,-7560,300,5480,'wall');               // left wall upper  -7560..-2080
  solid(4700,-1860,300,1560,'wall');               // left wall lower  -1860..-300  (arch below)
  solid(8600,-7560,400,7520,'wall');               // right wall
  solid(9000,-9000,400,1440,'wall');               // right plateau backstop
  // Crown plateau (top of mountain body) + backstop
  solid(2200,-8800,400,1240,'wall');
  // cave interior floor (x 3600..4700 between y -2080 and -1860): floor is the wall rect below; add a step
  solid(3400,-2080,200,220,'wall');                // cave back wall
  w.caves.push({x:3600,y:-2080,w:1100,h:220,amb:.9});
  // gates
  gate(2400,-380,40,300,'A');                      // vale glade A -> B
  gate(4700,-300,300,260,'B');                     // arch into the canyon
  // ---- Vale targets ----
  for(const [a,b,y] of G.slice(0,4)) grassRow(a<0?0:a,b,y,95);
  grassRow(5000,8600,-40,110);
  const oaks=[[700,-40],[1300,-40],[1750,-80],[2150,-80],[3050,-120],[3900,-80],[4500,-80],[5400,-40],[6300,-40],[7300,-40],[8200,-40]];
  for(const [x,y] of oaks)T('oak',x,y);
  T('ancient',2150,-460,{hidden:true});
  const flowers=[[420,-40],[1050,-40],[1620,-80],[2000,-80],[2350,-80],[2820,-120],[3350,-320],[3500,-120],[3750,-80],[4100,-500],[4300,-80],[4750,-80],[5250,-40],[5900,-40],[6800,-40],[7800,-40]];
  for(const [x,y] of flowers)T('flower',x,y);
  for(const [x,y] of [[560,-40],[1480,-40],[2550,-80],[3200,-120],[4200,-80],[5700,-40],[6600,-40],[8000,-40]])T('shrub',x,y);
  // shrines
  w.shrines.push({x:2560,y:-80,id:'vale',opened:false,name:"The Elder's Hand"});
  // enemies vale B
  enemy('shambler',3000,-120);enemy('shambler',3850,-80);enemy('shambler',4420,-80);
  enemy('shambler',6000,-40);enemy('shambler',7500,-40);
  // ---- CANYON ----
  buildCanyon();
  // ---- glades ----
  glade('The Hollow Vale',-600,2400,-1400,200,'A');
  glade('The Ash Field',2400,4700,-1400,200,'B');
  const gy=k=>world.gates.find(g=>g.key===k).y;
  glade('The Canyon Mouth',4700,8600,gy('C'),200,'C');
  glade('The First Shelf',4700,8600,gy('D'),gy('C'),'D');
  glade('The Second Shelf',4700,8600,gy('E'),gy('D'),'E');
  glade('The High Shelf',4700,8600,gy('F'),gy('E'),'F');
  const crown=glade('The Crown',2200,8600,-9000,gy('F'),'G');crown.noVerd=true;
  for(const t of w.targets){for(const g of w.glades){if(t.x>=g.x0&&t.x<g.x1&&t.y>=g.y0&&t.y<g.y1){t.glade=g;if(t.req&&!t.hidden)g.req.push(t);break}}}
  for(const g of w.glades)g.total=w.targets.filter(t=>t.glade===g).length;
  // link gates to glades
  for(const gt of w.gates){gt.glade=w.glades.find(g=>g.key===gt.key)}
}
function gate(x,y,w,h,key){const g={x,y,w,h,key,open:false,anim:0};world.gates.push(g);return g}
function glade(name,x0,x1,y0,y1,key){const g={name,x0,x1,y0,y1,key,req:[],done:false,ash:1,total:0};world.glades.push(g);return g}

/* ---- canyon generator: deterministic switchback ascent ---- */
function buildCanyon(){
  const R=mulberry(20260906);
  const rnd=(a,b)=>a+R()*(b-a);
  const pockets=[{y:-1900,x0:5000,x1:7600,side:-1},{y:-3900,x0:6000,x1:8600,side:1},{y:-5900,x0:5000,x1:7200,side:-1}];
  const free=(nx,ny,lw)=>{const r={x:nx-30,y:ny-200,w:lw+60,h:236};return !world.solids.some(o=>o.kind!=='wall'&&rectsHit(r,o))&&!world.vines.some(v=>(ny>v.y1-80&&ny<v.y0+80)&&(Math.abs(v.x-nx)<90||Math.abs(v.x-(nx+lw))<90))};
  const addLedge=(x,y,w,ex)=>{let nx=x,ny=y;const tries=[[0,0],[120,0],[-120,0],[240,0],[-240,0],[0,-70],[120,-70],[-120,-70],[360,0],[-360,0],[0,-140]];let placed=false;
    for(const [dx,dy] of tries){const tx=clamp(x+dx,SLOT.wallL+((ex&&ex.wall)?0:20),SLOT.wallR-w-((ex&&ex.wall)?0:20));if((ex&&ex.wall)&&dx!==0)continue;if(free(tx,y+dy,w)){nx=tx;ny=y+dy;placed=true;break}}
    if(!placed){ny=y-210}const L=solid(nx,ny,w,36,'rock',Object.assign({shard:1},ex||{}));return L};
  // pocket floors + contents
  for(const p of pockets){
    solid(p.x0,p.y,p.x1-p.x0,140,'ground',{pocket:1});
    grassRow(p.x0,p.x1,p.y,120);
    const cx=(p.x0+p.x1)/2;
    T('pine',cx-500,p.y);T('pine',cx+420,p.y);T('flower',cx-150,p.y);T('flower',cx+200,p.y);T('shrub',cx+40,p.y);
    if(p.y===-3900){world.shrines.push({x:cx+600,y:p.y,id:'shelf',opened:false,name:"The Second Hand"});enemy('shambler',cx-200,p.y)}
    if(p.y===-5900){enemy('shambler',cx+250,p.y);T('flower',cx+700,p.y)}
  }
  // hidden cave off pocket 1 (x 3600..4700, y -2080..-1860)
  T('fungus',4650,-1860,{hidden:true});T('fungus',4350,-1860,{hidden:true});T('fungus',4000,-1860,{hidden:true});T('fungus',3700,-1860,{hidden:true});T('fungus',4180,-2080,{hidden:true,ceil:1});
  world.pickups.push({x:3850,y:-1900,kind:'amber',got:false},{x:4450,y:-1900,kind:'amber',got:false});
  world.shrines.push({x:3650,y:-1860,id:'lesson',opened:false,name:'The Lesson',lore:true});
  const segs=[
    {sx:7400,sy:SLOT.floor,gx:pockets[0].x1+150,gy:pockets[0].y,gate:'C',gateY:-1900+560},
    {sx:pockets[0].x0+900,sy:pockets[0].y,gx:pockets[1].x0-150,gy:pockets[1].y,gate:'D',gateY:-3900+560},
    {sx:pockets[1].x1-900,sy:pockets[1].y,gx:pockets[2].x1+150,gy:pockets[2].y,gate:'E',gateY:-5900+560},
    {sx:pockets[2].x0+700,sy:pockets[2].y,gx:SLOT.wallL+120,gy:SLOT.top+300,gate:'F',gateY:-7560+760,summit:1},
  ];
  let wingCount=0;
  for(const s of segs){
    let cx=s.sx,cy=s.sy;const spots=[{y:cy,vine:false}];let steps=0;let next=2+(R()*2|0);
    const spot=(y,vine)=>{spots.push({y,vine:!!vine})};
    while(cy>s.gy+240&&steps<60){
      steps++;const need=cy-s.gy;
      const special=steps===next&&need>650;
      if(special){
        next=steps+3+(R()*2|0);
        const side=(cx-SLOT.wallL<SLOT.wallR-cx)?-1:1;const wx=side<0?SLOT.wallL:SLOT.wallR;
        // approach the wall with short jumps until close, then a hugging ledge
        let guard=0;while(Math.abs(cx-(side<0?wx+110:wx-110))>150&&guard<4){guard++;const lw=rnd(160,220);const dx=side*rnd(200,290);let nx=clamp(cx+dx-lw/2,SLOT.wallL+20,SLOT.wallR-lw-20);const L=addLedge(nx,cy-rnd(120,200),lw,{});cx=L.x+L.w/2;cy=L.y;spot(cy);if(R()<.3)T('flower',cx,cy)}
        const hw=190;const hx=side<0?wx:wx-hw;const H1=addLedge(hx,cy-rnd(110,170),hw,{wall:side});cx=H1.x+H1.w/2;cy=H1.y;spot(cy);
        const need2=cy-s.gy;
        if(R()<.62&&need2>640){ // climbvine
          const h=clamp(rnd(420,780),300,need2-300);const vx=side<0?wx+22:wx-22;const v={x:vx,y0:cy,y1:cy-h,side};
          v.target=T('vine',vx,cy,{vine:v});world.vines.push(v);
          if(R()<.6){const m={x:wx,y:cy-h-rnd(80,240),h:260,side};m.target=T('moss',wx+(side<0?12:-12),m.y+m.h,{moss:m});world.moss.push(m)}
          const tw=210;const tx=side<0?wx:wx-tw;const top=solid(tx,cy-h-10,tw,36,'rock',{shard:1,wall:side});cx=tx+tw/2;cy=top.y;spot(cy,true);
        }else{ // dead pine bough
          const by=cy-rnd(170,230);const bw=230;const bx=side<0?wx:wx-bw;const b={x:bx,y:by,w:bw,side};const pineY=by+rnd(280,400);
          world.pines.push({x:side<0?wx+30:wx-30,y:pineY,side,h:pineY-by+120});
          b.target=T('bough',side<0?wx+24:wx-24,by,{bough:b,r:280});world.oneway.push(b);cx=bx+bw/2;cy=by;spot(cy);
        }
      }else{ // jump ledge
        let dir=Math.sign(s.gx-cx)||1;
        if(need>900){dir=R()<.5?-1:1;if(cx<SLOT.wallL+700)dir=1;if(cx>SLOT.wallR-700)dir=-1}
        const dbl=need>1200&&R()<.3;

        const lw=rnd(140,240);let nx=clamp(cx+dx-lw/2,SLOT.wallL+70,SLOT.wallR-lw-70);

        cx=L.x+lw/2;cy=L.y;spot(cy);
      }
      if(steps%4===0&&wingCount<9){enemy('ashwing',clamp(cx+rnd(-500,500),SLOT.wallL+300,SLOT.wallR-300),cy-rnd(300,500));wingCount++}
    }
    if(s.summit){
      const lw=200;const L=addLedge(SLOT.wallL,cy-rnd(120,180),lw,{wall:-1});cy=L.y;spot(cy);
      const v={x:SLOT.wallL+22,y0:cy,y1:SLOT.top-6,side:-1};v.target=T('vine',v.x,cy,{vine:v,r:220,req:0});world.vines.push(v);
      solid(SLOT.wallL-60,SLOT.top,60,60,'rock');
    }else{
      const lw=200;const gx=clamp(s.gx-lw/2,SLOT.wallL+20,SLOT.wallR-lw-20);
      if(Math.abs(cx-s.gx)>320||cy-s.gy>240){const L=addLedge(gx,s.gy+rnd(170,230),lw,{});spot(L.y)}

    }
    // gate: between two consecutive standing spots with a ≥200 gap, nearest to gateY, never across a vine
    let best=null,bd=1e9;for(let i=1;i<spots.length;i++){const A=spots[i-1],B=spots[i];if(B.vine||A.y-B.y<190)continue;const gy=A.y-150;if(gy<s.gy+120)continue;const d=Math.abs(gy-s.gateY)+(i===spots.length-1?400:0);if(d<bd){bd=d;best=gy}}
    if(best===null){best=Math.max(cy-190,s.gy+120)}
    gate(SLOT.wallL,best,SLOT.wallR-SLOT.wallL,26,s.gate);
  }
  for(const x of [2750,2950,3800,4100,4400,4600])T('alpine',x,SLOT.top);
  T('stump',3250,SLOT.top,{r:260});
  grassRow(2200,4700,SLOT.top,140);
}

function drawGrass(t,x,y,seed,dead){

  const e=grow(t);const hgt=(alpine?22:40+R()*16)*e;const sw=Math.sin(TIME*1.3+seed)*3*e;

function branch(x,y,ang,len,wid,depth,e,R,maxD,leafCol){

/* ---- baking ---- */
const BAKE_RES=()=>clamp(SC,1,1.25);
function treeBounds(t){if(t.kind==='pine')return{w:340,h:420};if(t.kind==='ancient')return{w:1250,h:900};return{w:720,h:520}}
function bakeTree(t){
  const b=treeBounds(t),res=BAKE_RES();const c=document.createElement('canvas');c.width=Math.ceil(b.w*res);c.height=Math.ceil(b.h*res);
  const cc=c.getContext('2d');const saved=ctx;ctx=cc;
  cc.setTransform(res,0,0,res,b.w*res/2,b.h*res);
  if(t.kind==='pine')drawPine(1,0,0,t.seed,1);else drawOak(1,0,0,t.seed,t.kind==='ancient'?1.85:1);
  ctx=saved;
  t.bake={c,w:b.w,h:b.h};
}

function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts[i]=parts[parts.length-1];parts.pop();continue}
  if(p.kind==='leaf'){p.vy+=500*dt;p.vx*=.98;p.vx+=Math.sin(p.life*9+p.rot)*30*dt*60*.1}else if(p.kind==='pollen'){p.vy-=30*dt;p.vx+=Math.sin(p.life*3+p.rot)*40*dt}else if(p.kind==='ash'){p.vy+=40*dt;p.vx+=Math.sin(p.life*2+p.rot)*20*dt}else if(p.kind==='dust'){p.vy-=60*dt;p.vx*=.95}else if(p.kind==='spark'){p.vy+=200*dt}

/* ---- targets ---- */

function flourish(t){
  t.alive=true;t.t=1;t.flT=TIME;
  const [k,n]=MOTE[t.kind]||['sun',1];for(let i=0;i<n;i++)motes.push({x:t.x+(Math.random()-.5)*40,y:t.y-40-Math.random()*60,vx:(Math.random()-.5)*160,vy:-120-Math.random()*120,kind:k,age:0});
  spawn('pollen',t.x,t.y-40,t.kind==='grass'?2:8,{v:90,vy:-40,life:2.4,r:2.5,col:'#ffe08a',spread:60});
  if(t.kind==='oak'||t.kind==='pine'||t.kind==='ancient'){bakeTree(t);G.zoomPunch=Math.max(G.zoomPunch,.06);leafBurst(t.x,t.y-200,10);
    if(t.kind!=='pine')world.oneway.push({x:t.x-95,y:t.y-(t.kind==='ancient'?430:235),w:190,target:t,canopy:1});}
  if(t.kind==='ancient')msg('An ancient oak. It remembers.',3.5);
  if(t.kind!=='grass'){if(player.petals<player.maxPetals){player.petals=Math.min(player.maxPetals,player.petals+1)}}

}
function updateTargets(dt){

    if(t.t<=0){if(t.kind==='stump')continue;const dx=t.x-px,dy=t.y-py;const rr=t.r+ar-150;if(dx*dx+dy*dy<rr*rr)wake(t);continue}

  if(Math.random()<.5){const t=world.targets[(Math.random()*world.targets.length)|0];if(t.alive&&Math.abs(t.x-cam.x)<1200&&Math.abs(t.y-cam.y)<800)spawn('pollen',t.x,t.y-60,1,{v:30,vy:-20,life:4,r:2,col:'#ffe9a8',spread:80,a:.7})}

/* ---- glade / verdance ---- */

  G.cine={t:0,dur:3.2,skip:false,fx:cx,fy:cy,tick(t){cam.tz=t<2.6?.62:1;g.ash=a0*(1-smooth((t-.4)/1.8));if(gate){gate.anim=smooth((t-.9)/1.4);if(gate.anim>=1)gate.open=true}
      G.cineText=t>.6&&t<2.7?'Verdance\n'+g.name:'';G.cineBig=true;},
    end(){g.ash=0;if(gate){gate.open=true;gate.anim=1}cam.tz=1;G.cineText='';saveGame()}};
  spawn('pollen',player.x,player.y-60,40,{v:200,vy:-80,life:3,r:3,col:'#ffe08a',spread:300});

/* ---- player ---- */

    if(ctl&&inp.jumpP){p.onVine=null;p.vineCd=.35;p.vy=-P.jv*.9;p.vx=(Math.sign(inp.axis)||-v.side)*340;p.jumps=1;p.face=Math.sign(p.vx)||p.face;leafBurst(p.x,p.y-40,5)}
    if(p.onVine&&p.y<=top+6&&v.target.t>=1&&inp.u&&ctl){const s=world.solids.find(o=>o.kind!=='wall'&&o.x-60<=p.x&&o.x+o.w+60>=p.x&&o.y>=top-70&&o.y<=top+30);
      if(s){p.onVine=null;p.vineCd=.5;p.y=s.y;p.x=v.side<0?s.x+40:s.x+s.w-40;p.ground=true;p.jumps=0;p.anim.mantle=.25;p.lastGround={x:p.x,y:p.y}}}
    p.anim.state='climb';updateChains(dt);return}
  // ----- shrines (before jump so W/↑ opens instead of jumping) -----
  if(ctl&&p.ground){for(const s of world.shrines){if(Math.abs(s.x-p.x)<80&&Math.abs(s.y-p.y)<60){if(!s.hinted){s.hinted=true;msg(isTouch&&touchSeen?'Tap ▲ at the stone hand':'Press W or ↑ at the stone hand',3)}if(inp.actP){openShrine(s);p.buf=0;p.vx=0;updateChains(dt);return}}}}
  // ----- attach to vine -----
  if(ctl&&p.vineCd<=0&&(inp.u||inp.d)){for(const v of world.vines){if(v.target.t<=0)continue;const top=v.y0-(v.y0-v.y1)*grow(v.target.t);if(Math.abs(p.x-v.x)<44&&p.y>top&&p.y-96<v.y0+10&&p.y<v.y0+100){if(p.ground&&inp.d&&!inp.u)continue;p.onVine=v;p.y=clamp(p.y,top+4,v.y0);p.vx=0;p.vy=0;p.jumps=0;return}}}
  // ----- horizontal -----
  const tv=ax*P.run*(p.hurtT>0?.3:1);p.vx=approach(p.vx,tv,(p.ground?P.acc:P.acc*.55)*dt);if(ax&&p.hurtT<=0)p.face=Math.sign(ax);
  // ----- jumping -----
  if(p.coyote>0)p.coyote-=dt;if(p.buf>0)p.buf-=dt;
  if(ctl){if(inp.jumpP)p.buf=P.buf;if(inp.jumpR&&p.vy<-700)p.vy=-700;}
  if(p.buf>0){
    if(p.ground||p.coyote>0){p.vy=-P.jv;p.ground=false;p.coyote=0;p.buf=0;p.jumps=1;spawn('dust',p.x,p.y,4,{v:120,vy:-30,life:.5,r:5,col:'#8a8270',a:.5})}
    else if(p.wallSlide){p.vy=-1120;p.vx=-p.wallSide*540;p.face=-p.wallSide;p.jumps=1;p.buf=0;p.wallSlide=false;leafBurst(p.x,p.y-50,6)}
    else if(p.jumps<2&&p.up.double){p.vy=-P.dj;p.jumps=2;p.buf=0;leafBurst(p.x,p.y-30,9);spawn('pollen',p.x,p.y-30,6,{v:120,life:.8,r:2.5,col:'#ffe08a'})}

    const top=s.y;

    if(!p.ground&&top>=p.y-96-26&&top<=p.y-96+66&&(p.vx>=0?p.x<s.x:p.x>s.x+s.w)&&s.kind!=='gate'){
      const nx=p.vx>=0?s.x+22:s.x+s.w-22;const above={x:nx-17,y:top-96,w:34,h:96};
      if(!cols.some(o=>o!==s&&rectsHit(above,o))){p.y=top;p.x=nx;p.vy=0;p.vx=0;p.ground=true;p.jumps=0;p.anim.mantle=.3;p.lastGround={x:p.x,y:p.y};spawn('dust',p.x,p.y,3,{v:80,life:.4,r:4,col:'#8a8270',a:.5});b=body();continue}}
    if(p.vx>0){p.x=s.x-17.01;p.wallTouch=1}else if(p.vx<0){p.x=s.x+s.w+17.01;p.wallTouch=-1}else{const l=p.x-s.x,r=s.x+s.w-p.x;if(l<r)p.x=s.x-17.01;else p.x=s.x+s.w+17.01}

  if(!p.ground&&p.wallTouch&&p.vy>0){for(const m of world.moss){if(!m.target.alive)continue;if(m.side===p.wallTouch&&Math.abs(p.x-m.x)<70&&p.y>m.y-20&&p.y-96<m.y+m.h+40){p.wallSlide=true;p.wallSide=m.side;p.jumps=Math.min(p.jumps,1);if(Math.random()<.3)spawn('pollen',p.x+m.side*14,p.y-40,1,{v:40,life:.6,r:2,col:'#9fe07a'});break}}}

    else if(p.vy<0&&prevFeet-96>=s.y+s.h-10){p.y=s.y+s.h+96;p.vy=0;b=body()}
    else{const l=b.x+b.w-s.x,r=s.x+s.w-b.x;if(l<r)p.x=s.x-17.01;else p.x=s.x+s.w+17.01;b=body()}}
  if(!landed&&p.vy>=0&&!(ctl&&inp.d)){for(const o of world.oneway){if(!o.target.alive&&!(o.canopy&&o.target.t>.85))continue;const oy=o.y-(o.canopy?0:0);if(p.x>o.x-6&&p.x<o.x+o.w+6&&prevFeet<=oy+4&&p.y>=oy){p.y=oy;landed=o;p.vy=0;o.bounce=.4;break}}}
  if(landed){if(!wasGround){const fall=p.y-p.apex;p.anim.land=.18;spawn('dust',p.x,p.y,fall>600?8:3,{v:140,vy:-40,life:.5,r:5,col:'#8a8270',a:.45});
      if(fall>2.2*H&&!landed.canopy&&!landed.target){hurt(1,'fall');msg('Falling that far costs a petal. Trees would have caught you.',3)}}

  else{if(wasGround&&p.vy>=0){p.coyote=P.coyote;p.apex=p.y}p.ground=false;if(p.y<p.apex)p.apex=p.y}

}
function hurt(n,src){const p=player;if(p.inv>0||p.dead>0)return;
  if(p.veil>0){p.veil=0;spawn('pollen',p.x,p.y-50,20,{v:200,life:1,r:3,col:'#ffe08a'});p.inv=.6;return}
  p.petals-=n;p.inv=1.2;p.hurtT=.45;cam.shake=Math.max(cam.shake,14);if(src!=='fall'){p.vy=-460;p.vx=-p.face*320}

}

/* ---- chains (hair / cape verlet) ---- */
function initChains(){const p=player;const mk=(n,len)=>{const a=[];for(let i=0;i<n;i++)a.push({x:p.x-p.face*i*len,y:p.y-80+i*4,px:p.x-p.face*i*len,py:p.y-80+i*4,len});return a};p.hair=mk(7,7.5);p.cape=mk(2,8);p.cape2=mk(2,8)}

  const step=(ch,ax,ay,windY)=>{ch[0].x=ax;ch[0].y=ay;for(let i=1;i<ch.length;i++){const c=ch[i];const vx=(c.x-c.px)*.92,vy=(c.y-c.py)*.92;c.px=c.x;c.py=c.y;c.x+=vx+(-p.face*(140+Math.abs(p.vx)*.35)+Math.sin(TIME*3+i)*30)*dt*dt*60;c.y+=vy+(windY+Math.sin(TIME*4+i*.7)*60)*dt*dt*60}
    for(let k=0;k<3;k++)for(let i=1;i<ch.length;i++){const a=ch[i-1],b=ch[i];let dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy)||1;const diff=(d-b.len)/d;const f=i===1?1:.5;b.x-=dx*diff*f;b.y-=dy*diff*f;if(i>1){a.x+=dx*diff*(1-f)*.5;a.y+=dy*diff*(1-f)*.5}}};

/* ---- spells ---- */
function nearestEnemy(range,preferFace){const p=player;let best=null,bd=range*range;for(const e of world.enemies){if(e.dead)continue;const dx=e.x-p.x,dy=(e.y-40)-(p.y-48);let d=dx*dx+dy*dy;if(preferFace&&Math.sign(dx)!==p.face)d*=2.2;if(d<bd){bd=d;best=e}}return best}

/* ---- enemies ---- */
function floorFor(e){let best=null,bd=1e9;for(const s of world.solids){if(s.kind==='wall')continue;if(e.x>=s.x&&e.x<=s.x+s.w){const d=Math.abs(s.y-e.y);if(d<bd){bd=d;best=s}}}return best}
function damageEnemy(e,n){e.hp-=n;e.flash=.15;cam.shake=Math.max(cam.shake,4);spawn('ash',e.x,e.y-40,8,{v:200,life:.8,r:3,col:'#7a7a70'});

    if(e.kind==='shambler'){const t=T('grass',e.x,e.y,{});t.t=1;t.alive=true;t.glade=null}}}
function updateEnemies(dt){const p=player;

    if(e.flash>0)e.flash-=dt;
    if(e.held>0){e.held-=dt;e.state='held';e.vx=0;if(e.held<=0){e.state='idle';e.timer=.6}continue}
    const dx=p.x-e.x,dy=(p.y-48)-(e.y-40);const dist=Math.hypot(dx,dy);const canSee=p.dead<=0&&!G.cine;
    if(e.kind==='shambler'){
      if(!e.floor){e.floor=floorFor(e);if(e.floor)e.y=e.floor.y}
      const f=e.floor;const x0=f?f.x+30:e.x-300,x1=f?f.x+f.w-30:e.x+300;

      else if(e.state==='tele'){e.timer-=dt;e.x=e.sx+Math.sin(e.timer*40)*6;if(e.timer<=0){e.state='dive';e.timer=.85;const ang=Math.atan2(e.ty-e.y,e.tx-e.x);e.vx=Math.cos(ang)*980;e.vy=Math.sin(ang)*980}}

}

function updateMotes(dt){const p=player;const mr=magnetR();for(let i=motes.length-1;i>=0;i--){const m=motes[i];m.age+=dt;const dx=(p.x)-m.x,dy=(p.y-48)-m.y;const d=Math.hypot(dx,dy);

function shrineItems(s){const p=player,u=p.up;const it=[];

  if(!u.double)it.push({id:'double',name:'A second leaf',desc:'Jump again while in the air. The canyon needs it.',cost:12,kind:'sun'});
  if(s.id==='shelf'&&!p.spells[2].own)it.push({id:'veil',name:'Pollen Veil',desc:'Spell 3. A cloud of pollen that takes one hit for you.',cost:25,kind:'sun'});
  const ac=[0,15,35,70][u.aura];if(u.aura<4)it.push({id:'aura',name:'Reach '+['','II','III','IV'][u.aura],desc:'Wake things from further away.',cost:ac,kind:'sun'});
  const qc=[0,20,45][u.quick];if(u.quick<3)it.push({id:'quick',name:'Quickening '+['','II','III'][u.quick],desc:'Things grow faster around you.',cost:qc,kind:'sun'});
  if(u.petal<3)it.push({id:'petal',name:'Another petal',desc:'One more hit before you wilt.',cost:30+u.petal*20,kind:'sun'});
  if(u.magnet<3)it.push({id:'magnet',name:'Drawn to light',desc:'Motes come to you from further.',cost:10+u.magnet*12,kind:'dew',alt:'sun'});
  for(const i of it){const have=p.motes[i.kind]||0;i.can=have>=i.cost;if(!i.can&&i.alt&&(p.motes[i.alt]||0)>=i.cost*2){i.can=true;i.useAlt=true}}

function openShrine(s){G.menu={shrine:s,sel:0,items:shrineItems(s),t:0};s.opened=true;player.check={x:s.x,y:s.y};player.vx=0;if(s.lore){G.menu.reading=false}}
function buyItem(){const m=G.menu,it=m.items[m.sel];if(!it)return;const p=player;
  if(it.id==='lore'){m.reading=true;if(!p.spells[1].own){p.spells[1].own=true;msg('Rootgrasp learned. Key 2, or the second bud.',4)}saveGame();return}
  if(!it.can){msg('Not enough '+it.kind+'motes. Wake more of the world.',2.5);return}
  const k=it.useAlt?it.alt:it.kind;p.motes[k]-=it.useAlt?it.cost*2:it.cost;
  if(it.id==='double'){p.up.double=true;msg('A second leaf. Press jump again in the air.',4)}
  else if(it.id==='veil'){p.spells[2].own=true;msg('Pollen Veil. Spell 3 — it takes the next hit.',4)}
  else if(it.id==='aura')p.up.aura++;else if(it.id==='quick')p.up.quick++;else if(it.id==='petal'){p.up.petal++;p.maxPetals++;p.petals=p.maxPetals}else if(it.id==='magnet')p.up.magnet++;
  spawn('pollen',p.x,p.y-60,30,{v:200,vy:-100,life:1.4,r:3,col:'#ffe08a'});m.items=shrineItems(m.shrine);m.sel=Math.min(m.sel,Math.max(0,m.items.length-1));saveGame();}
function updateMenu(dt){const m=G.menu;m.t+=dt;
  if(inp.backP){G.menu=null;return}
  if(m.reading){if(inp.actP||inp.jumpP||inp.taps.length){G.menu=null}return}
  if(inp.pressed.includes('ArrowDown')||inp.pressed.includes('KeyS')||(inp.d&&!keys.ArrowDown&&!keys.KeyS&&!m._d2)){m.sel=(m.sel+1)%Math.max(1,m.items.length);m._d2=1}if(!inp.d)m._d2=0;
  if(inp.pressed.includes('ArrowUp')){m.sel=(m.sel-1+m.items.length)%Math.max(1,m.items.length);return}
  for(let i=0;i<5;i++)if(inp.spellP[i]&&i<m.items.length){m.sel=i;buyItem()}
  // taps
  for(const tp of inp.taps){const r=menuRows();for(let i=0;i<r.length;i++){const R=r[i];if(tp.x>=R.x&&tp.x<=R.x+R.w&&tp.y>=R.y&&tp.y<=R.y+R.h){if(R.close){G.menu=null;return}m.sel=i;buyItem();return}}}

  if(inp.pressed.some(k=>['Enter','KeyE','Space','KeyZ','KeyK'].includes(k))||gpA){buyItem()}

}
function menuRows(){const m=G.menu;const rows=[];const x=LW/2-360,w=720;const cp=H<1000;let y=cp?215:330;const h=cp?58:76,st=cp?64:86;for(let i=0;i<m.items.length;i++){rows.push({x,y,w,h,i});y+=st}rows.push({x:LW/2-100,y:y+(cp?8:20),w:200,h:cp?48:56,close:true});return rows}

function updateCamera(dt){const p=player;let fx,fy;
  if(G.cine&&G.cine.fx!==undefined){fx=G.cine.fx;fy=G.cine.fy}else{cam.look+=((p.face*190)-cam.look)*(1-Math.exp(-dt*2.2));fx=p.x+cam.look;fy=p.y-170+(p.onVine?-80:(p.vy<-200?-90:(p.vy>700?150:0)))}
  if(!G.cine){const c=inCave(p.x,p.y);const climbing=p.onVine||(!p.ground&&p.y<-900&&p.x>SLOT.x0-400&&p.x<SLOT.x1+200);cam.tz=(c?1.2:(climbing?.86:1))*(1+G.zoomPunch)}
  G.zoomPunch*=Math.exp(-dt*5);
  cam.z+=(cam.tz-cam.z)*(1-Math.exp(-dt*(G.cine?1.1:3)));
  cam.x+=(fx-cam.x)*(1-Math.exp(-dt*(G.cine?1.5:6)));cam.y+=(fy-cam.y)*(1-Math.exp(-dt*(G.cine?1.5:5)));
  const hw=LW/(2*cam.z),hh=H/(2*cam.z);

  if(cam.shake>0)cam.shake=Math.max(0,cam.shake-dt*40);
}

function ridge(f,base,amp,freq,seed,col,trees){worldT(f);const z=cam.z;const x0=cam.x*f-LW/(2*z)-200,x1=cam.x*f+LW/(2*z)+200;const yb=cam.y*f+H/(2*z)+400;

  if(ashT>.3&&Math.random()<.35)spawn('ash',cam.x+(Math.random()-.5)*LW/cam.z,cam.y-H/(2*cam.z)-20,1,{v:20,vy:40,life:9,r:2.5,col:'#8f8f86',a:.55*ashT});
  const cv2=inCave(p.x,p.y);const darkT=cv2?cv2.amb:0;G.dark+=(darkT-G.dark)*(1-Math.exp(-dt*2.5));
  if(G.msgT>0)G.msgT-=dt;
  // crown reveal trigger
  if(!G.cine&&!G.crownSeen&&p.ground&&p.y<=SLOT.top+2&&p.x<3900&&p.x>2300)revealCine();
  // arch hint
  if(!p.up.double&&!G._archHint&&p.x>4400&&p.x<4700&&p.ground){G._archHint=true;msg('The canyon wants a second jump. The stone hand in the vale sells one.',4.5)}
  if(inp.backP&&!G.cine){G.paused=!G.paused}
}
function update(dt){TIME+=dt;readInput();
  if(G.mode==='title'){G.titleA+=(1-G.titleA)*(1-Math.exp(-dt*1.5));G.fade+=(0-G.fade)*(1-Math.exp(-dt*2));
    let act=null;const rows=titleRows();for(const tp of inp.taps){for(const R of rows)if(tp.x>=R.x&&tp.x<=R.x+R.w&&tp.y>=R.y&&tp.y<=R.y+R.h)act=R.act}
    if(!act&&inp.pressed.some(k=>k==='Enter'||k==='Space'))act=G.hasSave?'continue':'new';
    if(!act&&inp.pressed.includes('KeyN')&&G.hasSave)act='new';if(!act&&gp&&gp.buttons[0]&&gp.buttons[0].pressed&&!G._gk){G._gk=1;act=G.hasSave?'continue':'new'}if(gp&&!(gp.buttons[0]&&gp.buttons[0].pressed))G._gk=0;
    if(act==='new'){newGame();G.hasSave=false;resetWorld();startPlay(false)}else if(act==='continue'){startPlay(true)}
    return}
  if(G.mode==='end'){G.fade+=(0-G.fade)*(1-Math.exp(-dt*1.5));if(inp.anyP&&TIME-G.endT>1.5){G.mode='title';player.x=2560;player.y=-80;player.check={x:2560,y:-80};G.titleA=0}return}
  if(G.paused){if(inp.backP||inp.jumpP)G.paused=false;return}
  G.letter+=((G.cine?1:0)-G.letter)*(1-Math.exp(-dt*4));
  G.fade+=(G.fadeT-G.fade)*(1-Math.exp(-dt*2.2));
  updateGame(dt);updateCamera(dt);
}
function resetWorld(){world.solids.length=0;world.oneway.length=0;world.vines.length=0;world.moss.length=0;world.targets.length=0;world.enemies.length=0;world.shrines.length=0;world.glades.length=0;world.gates.length=0;world.caves.length=0;world.pickups.length=0;world.pines.length=0;tid=0;buildWorld();
  const p=player;p.x=300;p.y=-40;p.vx=p.vy=0;p.petals=5;p.maxPetals=5;p.motes={sun:0,dew:0,spore:0,amber:0};p.up={double:false,aura:1,quick:1,petal:0,magnet:1};p.spells.forEach((s,i)=>{s.own=i===0;s.cd=0});p.check={x:300,y:-40};p.lastGround={x:300,y:-40};p.apex=p.y;p.dead=0;p.onVine=null;p.ground=true;G.crownSeen=false;G._archHint=false;G.dawn=0;G.red=0;G.stump=0;G.ashV=1;G.dark=0;motes.length=0;bolts.length=0;parts.length=0}

/* ---- render ---- */
function render(){ctx.setTransform(1,0,0,1,0,0);
  if(G.mode==='title'){drawTitle();drawPost();drawFadeRect();return}
  if(G.mode==='end'){drawEnd();drawPost();drawFadeRect();return}
  const sx=cam.shake?(Math.random()-.5)*cam.shake:0,sy=cam.shake?(Math.random()-.5)*cam.shake:0;
  view.x0=cam.x-LW/(2*cam.z);view.x1=cam.x+LW/(2*cam.z);view.y0=cam.y-H/(2*cam.z);view.y1=cam.y+H/(2*cam.z);
  drawSky();drawFar();
  const wt=()=>worldT(1,sx,sy);const oldWorldT=worldT;
  drawTerrain();drawShadows();drawGates();drawPlants();drawShrines();drawEnemies();
  worldT(1);if(player.dead<=0||player.dead>0)drawWren(false);
  drawBolts();drawMotes();drawParts();
  drawLights();drawGrade();drawPost();drawHUD();drawCineText();drawMenu();
  if(G.paused){screenT();ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,LW,H);ctx.fillStyle='#ece6d4';ctx.font='500 48px '+SERIF;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('paused',LW/2,H/2);ctx.font='400 20px '+SANS;ctx.fillText('Esc or jump to continue',LW/2,H/2+50)}
  drawFadeRect()}
function drawFadeRect(){if(G.fade>.005){screenT();ctx.fillStyle='rgba(6,9,6,'+clamp(G.fade,0,1)+')';ctx.fillRect(0,0,LW,H)}}

/* ---- boot ---- */
buildWorld();initChains();
try{G.hasSave=!!localStorage.getItem(SAVEKEY)}catch(e){}
if(G.hasSave){if(!loadGame())G.hasSave=false}
let last=performance.now(),acc=0;const DT=1/60;
function frame(now){let el=(now-last)/1000;last=now;if(el>.25)el=.25;acc+=el;let n=0;while(acc>=DT&&n<4){update(DT);acc-=DT;n++}if(n===4)acc=0;render();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
// debug / test hooks
window.SL={G,player,world,cam,inp,motes,parts,tp(x,y){player.x=x;player.y=y;player.vx=player.vy=0;player.apex=y;player.check={x,y};player.lastGround={x,y};cam.x=x;cam.y=y-170;initChains()},give(n=100){player.motes.sun+=n;player.motes.dew+=n;player.motes.amber+=n},wakeAll(){for(const t of world.targets)if(!t.alive&&t.kind!=='stump')flourish(t)},start(){newGame();resetWorld();startPlay(false)},skip(){if(G.cine)G.cine.t=G.cine.dur},update,render};
</script>
